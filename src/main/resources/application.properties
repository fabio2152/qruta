spring.application.name=qruta-trazabilidad

# PostgreSQL levantado con docker compose (ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5434/qruta_db
spring.datasource.username=qruta
spring.datasource.password=qruta

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Escucha en todas las interfaces: así el celular, en la misma red Wi-Fi, abre la consulta del QR
server.address=0.0.0.0
server.port=8080
