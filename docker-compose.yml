services:
  postgres:
    image: postgres:17
    container_name: qruta-fase2-postgres
    environment:
      POSTGRES_DB: qruta_db
      POSTGRES_USER: qruta
      POSTGRES_PASSWORD: qruta
    ports:
      - "5434:5432"
    volumes:
      - qruta-fase2-datos:/var/lib/postgresql/data

volumes:
  qruta-fase2-datos:
